<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"><title>Bittle X Robot</title><style>
            header {
                padding-top: env(safe-area-inset-top);
            }
            footer {
                padding-bottom: env(safe-area-inset-bottom);
            }
            body,
            html {
                margin: 0;
                padding: 0;
                height: 100vh; /* Fallback for older browsers */
                height: 100dvh; /* The "magic" unit that adjusts to mobile UI */
                overflow: hidden;
                width: 100%;
                display: flex;
                position: relative;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
        </style><link rel="stylesheet" href="css/project-sidebar.css"><link rel="stylesheet" href="css/project-dialog.css"><link rel="stylesheet" href="css/explorer.css"><link rel="stylesheet" href="css/editor.css"><link rel="stylesheet" href="css/reset-button.css"><link rel="stylesheet" href="css/spinner.css"><script defer src="bundle.js"></script><link href="css/main.css" rel="stylesheet"></head><body><div class="main-wrapper">
            
            <div class="project-sidebar" id="projectSidebar">
                <button class="project-sidebar-button" id="projectDialogButton" title="Project Dialog">
                    +
                </button>
                <button class="project-sidebar-button" id="toggleExplorerButton" title="Toggle Explorer">
                    ☰
                </button>
                <button class="project-sidebar-button" id="downloadButton" title="Download Project">
                    ⬇︎
                </button>
            </div>
            
            <div class="hidden project-dialog" id="projectDialog">
                <button class="create-project-btn" id="createProjectBtn">
                    New Project
                </button>
                <button class="new-file-btn" id="newFileBtn">New File</button>
            </div>
            
            <div class="explorer" id="explorer">
                <div class="explorer-header">Files</div>
                <div class="explorer-files" id="explorerFiles"></div>
            </div>
            <div class="editor-container" id="editorContainer">
                <div class="file-bar" id="fileBar">
                    <div class="file-tab-scroll" id="fileTabScroll">
                        
                    </div>
                    <div class="file-bar-actions" id="fileBarActions">
                        <button class="run-button" id="runButton">
                            <span>🔨</span>
                            <span>Compile</span>
                        </button>
                    </div>
                </div>
                <div id="editor"></div>
            </div>
            
            <div class="main-resize-handle" id="mainResizeHandle"></div>
            
            <div id="threejs">
                <div id="compile-spinner">
                    <div class="spinner-small"></div>
                    <div class="spinner-text">Compiling...</div>
                </div>
                <div id="loading" class="loading-overlay">
                    <div class="spinner"></div>
                    <p>Loading simulation assets...</p>
                </div>
                <button class="reset-button" id="resetButton">
                    <span>🔄</span>
                    <span>Reset</span>
                </button>
                <button class="reset-button" id="toggleModeButton" style="top: 40px">
                    <span>⚙️</span>
                    <span>Mode</span>
                </button>
                <div class="bottom-container">
                    <div class="controls-row">
                        <div class="wasd-container" id="wasdContainer">
                            <button class="wasd-button" id="btnW">W</button>
                            <div class="wasd-row">
                                <button class="wasd-button" id="btnA">A</button>
                                <button class="wasd-button" id="btnS">S</button>
                                <button class="wasd-button" id="btnD">D</button>
                            </div>
                        </div>
                        <div class="action-key-container wasd-container" id="actionKeyContainer">
                            <button class="wasd-action wasd-button" id="btnRecover">
                                RECOVER
                            </button>
                            <button class="wasd-action wasd-button" id="btnStand">
                                STAND
                            </button>
                        </div>
                    </div>
                    <div class="build-output" id="buildOutput">
                        <button class="close-output" id="closeOutput">×</button>
                        <div id="outputContent"></div>
                        <div id="serialMonitor"></div>
                    </div>
                    <div class="serial-input-bar" id="serialInputBar">
                        <input class="serial-input" id="serialInput" type="text" placeholder="serial monitor input..." autocomplete="off" spellcheck="false">
                        <button class="serial-send" id="serialSend" title="Send (Enter)">
                            Send
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="overlay">
                <div class="header-logos">
                    <div id="petoi-logo-container">
                        <a href="https://petoi.com/" target="_blank">
                            <img src="petoi_logo.avif" alt="Petoi Logo" id="petoi-logo-img">
                        </a>
                    </div>
                    <div class="collaboration-separator">X</div>
                    <div id="ape-logo">
                        <a href="https://aperobotics.io/" target="_blank">
                            
                            APE
                        </a>
                    </div>
                </div>
                <div id="realtimeRatio">realtime rate: 1.0</div>
                <div class="movement-button-container" id="movementButtonContainer"></div>
            </div>
        </div></body></html>
